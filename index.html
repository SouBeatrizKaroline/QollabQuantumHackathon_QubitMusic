<div class="studio">
  <header><a class="brand" href="#">◈ <span>QubitMusic</span></a><span class="tag">QUANTUM IMPACT · QOLLAB</span><select id="language" aria-label="Language"><option value="en">English</option><option value="pt-BR">Português · Brasil</option><option value="pt-PT">Português · Portugal</option><option value="es">Español</option></select></header>
  <main>
    <section class="hero"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="intro" data-i18n="intro"></p><div class="chips"><span data-i18n="chip1"></span><span data-i18n="chip2"></span><span data-i18n="chip3"></span></div></section>
    <section class="workspace">
      <aside class="panel controls"><p class="eyebrow" data-i18n="brief"></p><h2 data-i18n="make"></h2>
        <label for="preset" data-i18n="use"></label><select id="preset"><option value="lesson" data-i18n="lesson"></option><option value="story" data-i18n="story"></option><option value="game" data-i18n="game"></option></select>
        <label for="duration"><span data-i18n="duration"></span><output id="durationValue">24 s</output></label><input id="duration" type="range" min="8" max="60" value="24" step="1">
        <label for="energy"><span data-i18n="energy"></span><output id="energyValue">40%</output></label><input id="energy" type="range" min="0" max="100" value="40">
        <label for="sound" data-i18n="sound"></label><select id="sound"><option value="warm" data-i18n="warm"></option><option value="glass" data-i18n="glass"></option><option value="pulse" data-i18n="pulse"></option></select>
        <label for="key" data-i18n="key"></label><select id="key"><option value="60">C</option><option value="62">D</option><option value="65">F</option><option value="57">A</option></select>
        <label for="seed" data-i18n="seed"></label><input id="seed" type="number" min="1" max="999999" value="42">
        <button id="generate" class="primary" data-i18n="generate"></button><button id="remix" class="subtle" data-i18n="remix"></button><p class="fine" data-i18n="privacy"></p>
      </aside>
      <div class="result panel"><div class="result-top"><div><p class="eyebrow" data-i18n="canvas"></p><h2 id="trackTitle" data-i18n="untitled"></h2></div><span class="live-dot" id="engineBadge"></span></div>
        <div class="score" id="score" aria-label="Music score"></div>
        <div class="timeline" id="timeline"></div><div class="transport"><button id="play" class="primary" disabled data-i18n="play"></button><button id="stop" disabled data-i18n="stop"></button><label class="volume"><span data-i18n="volume"></span><input type="range" id="volume" min="0" max="100" value="35"></label></div>
        <div class="downloads"><button id="wav" disabled data-i18n="wav"></button><button id="json" disabled data-i18n="json"></button><button id="classical" disabled data-i18n="classical"></button></div>
        <p id="status" role="status" aria-live="polite"></p>
        <div class="metrics"><div><span data-i18n="cost"></span><strong id="cost">—</strong></div><div><span data-i18n="optimal"></span><strong id="optimal">—</strong></div><div><span data-i18n="gap"></span><strong id="gap">—</strong></div><div><span data-i18n="states"></span><strong>64</strong></div></div>
        <details><summary data-i18n="behind"></summary><p data-i18n="explain"></p><p id="circuitInfo"></p><div id="histogram" class="histogram"></div><p class="fine" data-i18n="honesty"></p></details>
      </div>
    </section>
    <section class="impact"><div><span class="number">01</span><h3 data-i18n="problem"></h3><p data-i18n="problemText"></p></div><div><span class="number">02</span><h3 data-i18n="quantum"></h3><p data-i18n="quantumText"></p></div><div><span class="number">03</span><h3 data-i18n="output"></h3><p data-i18n="outputText"></p></div></section>
    <footer><span>QubitMusic · MIT · 2026</span><a href="https://github.com/SouBeatrizKaroline/QollabQuantumHackathon_QubitMusic" target="_blank" rel="noopener" data-i18n="source"></a><span data-i18n="footer"></span></footer>
  </main>
</div>
